# Protocolo ResBO — IDENTICO para todos los brazos (MFO, GWO, PSO, FOA, BO+prior, BO solo)
# Caja de controles: [RATE x 8 inyectores (sm3/d), BHP x 4 productores (bar)]
# T-R1 (2026-11-17): caja, economia y presupuestos ALINEADOS al caso real EGG_TEST
# de BIOPSO (configs/egg_*_protocol.yaml) para que el mock y la coleta S1 hablen
# la misma moneda. Antes: caja mock 500-3000/150-350 y 2 terminos de costo.
project: ResBO
reservoir: egg-mock          # MockSimulator local; egg-opm en MC2 (BIOPSO EGG_TEST)
n_injectors: 8
n_producers: 4
horizon_months: 130

bounds:                      # = injeRateMin/Max y prodBhpMin/Max del caso EGG_TEST
  rate:  [0.0, 150.0]        # sm3/d por inyector
  bhp:   [200.0, 395.0]      # bar por productor

# Control base del deck (injectorValues/producerValues de BIOPSO): PSO y FOA
# anclan aqui su particula/mosca 0, como en las versiones del repo
base_controls:
  rate: 79.5
  bhp: 395.0

economics:                   # = NPVParams del caso EGG_TEST (USD/sm3), via NPVHandler
  oil_revenue: 45.0          # oilRevenue: ingreso por m3 de ACEITE producido
  water_cost: 6.0            # waterCost: coste por m3 de AGUA producida
  water_injection_cost: 2.0  # waterInjectionCost: coste por m3 de AGUA inyectada
  annual_discount: 0.08      # discountRate anual

budget:                      # por brazo y por seed (contingencia: bajar n_seeds/iter)
  metaheuristics: {pop: 15, iters: 6}                # 15*6 = 90 sims = coleta S1
  bo: {batch: 5, iters: 16, pool: 4000, n_init: 10}  # 10+16*5 = 90 sims (mismo presupuesto)
n_seeds: 20                  # protocolo real; la demo toy lo sobreescribe (--quick)

# hiperparametros por algoritmo — DEFAULTS IGUALITOS a los del repo BIOPSO
# (pso_wellcontrol.py / foa_wellcontrol.py) para que la version local replique
# el comportamiento de las corridas que generan los datos de entrenamiento
pso:
  inertia: 0.7               # psoInertia (w CONSTANTE, sin decay)
  cognitive: 1.5             # psoCognitive (c1)
  social: 1.5                # psoSocial (c2)
foa:
  step: 0.1                  # foaStep: radio de vuelo = 0.1 * ancho de caja

crm:
  min_excitation: 50.0       # umbral de tasa para considerar excitada una arista

prior:
  w0: 0.5                    # peso inicial del prior en la adquisicao
  decay_obs: 30.0            # decaimiento estilo DynMeanBO: w = w0 * exp(-n_obs/decay_obs)
  use_full_crm: true         # false => voidage escalar (caso degenerado)

analysis:
  equivalence:               # FIJADO 2026-11-17 ANTES de ver datos reales (CHANGELOG)
    delta_frac: 0.02         # delta = 2 % de la mediana del MEJOR baseline (USD absolutos)
    ci: 0.90                 # IC90 bootstrap de la dif. de medianas dentro de +-delta (= TOST alpha 0.05)

paths:
  experiments: experiments
